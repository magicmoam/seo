[project]
name = "tryseo"
version = "1.0.0"
description = "trySEO.ai - AI-powered SEO intelligence SaaS platform"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "supabase>=2.0",
    "python-docx>=1.1",
    "google-analytics-data>=0.18",
    "cryptography>=42.0",
    "stripe>=8.0",
]

[project.scripts]
tryseo = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
