<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wongzo</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg-deep: #1a262b;
      --c-bg-light: #8e6e53;
      --c-text-primary: #ffffff;
      --c-text-secondary: rgba(255, 255, 255, 0.7);
      --c-text-tertiary: rgba(255, 255, 255, 0.4);
      --c-accent: #d4b895;
      --c-red: #ff6b6b;
      --c-glass-bg: rgba(255, 255, 255, 0.03);
      --c-glass-border: rgba(255, 255, 255, 0.15);
      --c-glass-hover: rgba(255, 255, 255, 0.05);
      --c-pill-bg: rgba(255, 255, 255, 0.05);
      --c-pill-border: rgba(255, 255, 255, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--c-bg-deep);
      background-image: linear-gradient(135deg, rgba(26, 38, 43, 0.8) 0%, rgba(66, 52, 40, 0.8) 100%);
      background-attachment: fixed;
      color: var(--c-text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-weight: 300;
      line-height: 1.6;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Glass panel utility ── */
    .glass-panel {
      background: var(--c-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--c-glass-border);
      border-radius: 12px;
    }

    /* ════════════════════════════════════════
       AUTH SCREEN
       ════════════════════════════════════════ */
    .auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      animation: fadeIn 0.8s ease-out;
    }
    .auth-card {
      background: var(--c-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--c-glass-border);
      border-radius: 20px;
      padding: 56px 48px;
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .auth-card h1 {
      font-size: 48px;
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .auth-card p {
      color: var(--c-text-secondary);
      font-size: 15px;
      font-weight: 300;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .auth-card #google-btn {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }
    .auth-error {
      color: var(--c-red);
      font-size: 13px;
      font-weight: 400;
      margin-top: 16px;
      display: none;
    }
    .auth-error.show { display: block; }

    /* ════════════════════════════════════════
       TOP BAR
       ════════════════════════════════════════ */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 56px;
      background: rgba(26, 38, 43, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--c-glass-border);
    }
    .topbar-brand {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--c-text-primary);
    }
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-user img {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid var(--c-glass-border);
    }
    .topbar-user span {
      font-size: 13px;
      color: var(--c-text-secondary);
      font-weight: 400;
    }
    .btn-logout {
      padding: 5px 16px;
      border: 1px solid var(--c-pill-border);
      border-radius: 999px;
      background: var(--c-pill-bg);
      color: var(--c-text-secondary);
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .btn-logout:hover {
      border-color: rgba(255, 107, 107, 0.5);
      color: var(--c-red);
      background: rgba(255, 107, 107, 0.08);
      box-shadow: 0 2px 12px rgba(255, 107, 107, 0.1);
      transform: translateY(-1px);
    }

    /* ════════════════════════════════════════
       LAYOUT
       ════════════════════════════════════════ */
    .layout {
      display: flex;
      min-height: 100vh;
      padding-top: 56px;
    }

    /* ════════════════════════════════════════
       SIDEBAR
       ════════════════════════════════════════ */
    .sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--c-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid var(--c-glass-border);
      padding: 24px 16px;
      overflow-y: auto;
      height: calc(100vh - 56px);
      position: sticky;
      top: 56px;
    }
    .sidebar-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 16px;
      position: relative;
    }
    .sidebar-label::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40px; height: 1px;
      background: var(--c-accent);
    }
    .sidebar-label-text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-accent);
    }
    .sidebar-label .count {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--c-text-tertiary);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .history-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .history-item:hover { background: var(--c-glass-hover); }
    .history-item .hi-query {
      font-size: 13px;
      font-weight: 400;
      color: var(--c-text-primary);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    .history-item .hi-meta {
      font-size: 11px;
      color: var(--c-text-tertiary);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .history-item .hi-tool {
      color: var(--c-accent);
      font-weight: 500;
      text-transform: capitalize;
    }
    .history-empty {
      color: var(--c-text-tertiary);
      font-size: 13px;
      text-align: center;
      padding: 48px 0;
      font-weight: 300;
    }

    /* ════════════════════════════════════════
       MAIN CONTENT
       ════════════════════════════════════════ */
    .main {
      flex: 1;
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 32px 80px;
      animation: fadeIn 0.6s ease-out 0.1s both;
    }

    /* ── Tool Chips ── */
    .tools {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .tool-chip {
      padding: 8px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 400;
      background: var(--c-pill-bg);
      border: 1px solid var(--c-pill-border);
      color: var(--c-text-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Inter', sans-serif;
    }
    .tool-chip:hover {
      background: rgba(212, 184, 149, 0.08);
      border-color: rgba(212, 184, 149, 0.4);
      color: var(--c-accent);
      box-shadow: 0 4px 16px rgba(212, 184, 149, 0.08);
      transform: translateY(-1px);
    }
    .tool-chip.active {
      background: rgba(212, 184, 149, 0.12);
      border-color: var(--c-accent);
      color: var(--c-accent);
      box-shadow: 0 4px 20px rgba(212, 184, 149, 0.12);
    }

    /* ── Input Area ── */
    .input-area {
      position: relative;
      margin-bottom: 36px;
    }
    .input-area textarea {
      width: 100%;
      padding: 20px 130px 20px 24px;
      background: var(--c-glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--c-glass-border);
      border-radius: 16px;
      color: var(--c-text-primary);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      resize: none;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      min-height: 64px;
      max-height: 140px;
      line-height: 1.6;
    }
    .input-area textarea:focus {
      border-color: var(--c-accent);
      box-shadow: 0 0 0 3px rgba(212, 184, 149, 0.08);
    }
    .input-area textarea::placeholder {
      color: var(--c-text-tertiary);
      font-weight: 300;
    }
    .input-area button {
      position: absolute;
      right: 12px; bottom: 12px;
      padding: 10px 28px;
      border: 1px solid var(--c-pill-border);
      border-radius: 999px;
      background: var(--c-pill-bg);
      color: var(--c-text-primary);
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .input-area button:hover:not(:disabled) {
      background: rgba(212, 184, 149, 0.12);
      border-color: var(--c-accent);
      color: var(--c-accent);
      box-shadow: 0 4px 16px rgba(212, 184, 149, 0.1);
      transform: translateY(-1px);
    }
    .input-area button:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Loading ── */
    .loading {
      text-align: center;
      padding: 72px 0;
      display: none;
      animation: fadeIn 0.4s ease-out;
    }
    .loading.show { display: block; }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--c-accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    .loading p {
      color: var(--c-text-tertiary);
      font-size: 14px;
      font-weight: 300;
    }

    /* ── Error ── */
    .error {
      background: rgba(255, 107, 107, 0.06);
      border: 1px solid rgba(255, 107, 107, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      color: var(--c-red);
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 24px;
      display: none;
    }
    .error.show { display: block; animation: fadeIn 0.3s ease-out; }

    /* ════════════════════════════════════════
       RESULTS
       ════════════════════════════════════════ */
    .result { display: none; }
    .result.show { display: block; animation: fadeIn 0.5s ease-out; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--c-glass-border);
    }
    .result-badge {
      padding: 5px 14px;
      border-radius: 999px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(212, 184, 149, 0.12);
      color: var(--c-accent);
      border: 1px solid rgba(212, 184, 149, 0.2);
    }
    .result-query {
      color: var(--c-text-tertiary);
      font-size: 14px;
      font-weight: 300;
    }

    /* ── Result Panels ── */
    .result-panel {
      padding: 24px;
      margin-bottom: 20px;
    }
    .panel-label {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--c-accent);
      margin-bottom: 14px;
      padding-top: 12px;
      position: relative;
    }
    .panel-label::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 40px; height: 1px;
      background: var(--c-accent);
    }
    .panel-list { list-style: none; padding: 0; }
    .panel-list li {
      padding: 6px 0 6px 20px;
      font-size: 14px;
      font-weight: 300;
      color: var(--c-text-secondary);
      position: relative;
      line-height: 1.6;
    }
    .panel-list li::before {
      content: '\203A';
      position: absolute;
      left: 2px;
      color: var(--c-accent);
      font-size: 16px;
      line-height: 1.5;
    }
    .summary-text {
      font-size: 15px;
      font-weight: 300;
      line-height: 1.7;
      color: var(--c-text-secondary);
    }

    /* ── Data Tables ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      text-align: left;
      padding: 12px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--c-accent);
      border-bottom: 1px solid var(--c-glass-border);
      background: rgba(255, 255, 255, 0.02);
    }
    .data-table td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      vertical-align: top;
      font-weight: 300;
      color: var(--c-text-secondary);
    }
    .data-table td strong {
      color: var(--c-text-primary);
      font-weight: 500;
    }
    .data-table tr:hover td { background: rgba(255, 255, 255, 0.02); }
    .data-table tr:last-child td { border-bottom: none; }
    .cell-dim { color: var(--c-text-tertiary); font-size: 12px; }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .badge-low {
      background: rgba(212, 184, 149, 0.15);
      color: var(--c-accent);
    }
    .badge-medium {
      background: rgba(255, 255, 255, 0.1);
      color: var(--c-text-secondary);
    }
    .badge-high {
      background: rgba(255, 107, 107, 0.15);
      color: var(--c-red);
    }
    .badge-intent {
      background: rgba(212, 184, 149, 0.1);
      color: var(--c-accent);
      border: 1px solid rgba(212, 184, 149, 0.15);
    }

    /* ── SERP Position ── */
    .serp-pos {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border-radius: 8px;
      background: rgba(212, 184, 149, 0.1);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 400;
      color: var(--c-accent);
      border: 1px solid rgba(212, 184, 149, 0.15);
    }

    /* ── Competitor Cards ── */
    .competitor-card h3 {
      font-size: 16px;
      font-weight: 500;
      color: var(--c-text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }
    .comp-url {
      color: var(--c-text-tertiary);
      font-size: 12px;
      margin-bottom: 14px;
      word-break: break-all;
      font-weight: 300;
    }
    .comp-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--c-text-tertiary);
      font-weight: 400;
    }
    .strengths, .weaknesses {
      font-size: 13px;
      margin-bottom: 8px;
      list-style: none;
      padding: 0;
    }
    .strengths li { color: var(--c-accent); font-weight: 400; }
    .weaknesses li { color: rgba(255, 107, 107, 0.7); font-weight: 400; }
    .strengths li, .weaknesses li {
      margin-bottom: 5px;
      padding-left: 18px;
      position: relative;
      line-height: 1.5;
    }
    .strengths li::before {
      content: '+';
      position: absolute; left: 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
    }
    .weaknesses li::before {
      content: '\2212';
      position: absolute; left: 0;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
    }

    /* ── Content Generation ── */
    .article-meta h2 {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--c-text-primary);
      margin-bottom: 10px;
    }
    .meta-desc {
      color: var(--c-text-secondary);
      font-size: 14px;
      font-style: italic;
      font-weight: 300;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .kw-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .kw-tag {
      padding: 4px 14px;
      background: rgba(212, 184, 149, 0.12);
      border: 1px solid rgba(212, 184, 149, 0.2);
      border-radius: 999px;
      font-size: 12px;
      color: var(--c-accent);
      font-weight: 400;
    }
    .word-count {
      font-size: 13px;
      color: var(--c-text-tertiary);
      font-weight: 300;
      margin-top: 8px;
    }
    .article-content {
      font-size: 15px;
      line-height: 1.8;
      font-weight: 300;
      color: var(--c-text-secondary);
    }
    .article-content h1,
    .article-content h2,
    .article-content h3 {
      color: var(--c-text-primary);
      margin: 28px 0 14px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .article-content h1 { font-size: 24px; }
    .article-content h2 {
      font-size: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--c-glass-border);
    }
    .article-content h3 { font-size: 17px; color: var(--c-accent); }
    .article-content p { margin-bottom: 14px; }
    .article-content ul, .article-content ol { margin: 10px 0 18px 24px; }
    .article-content li { margin-bottom: 6px; font-weight: 300; }
    .article-content strong { color: var(--c-text-primary); font-weight: 500; }

    /* ── Fallback pre ── */
    .result pre {
      background: var(--c-glass-bg);
      border: 1px solid var(--c-glass-border);
      border-radius: 12px;
      padding: 24px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--c-text-secondary);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { padding: 28px 16px 60px; }
      .topbar { padding: 0 16px; }
      .topbar-user span { display: none; }
      .auth-card { padding: 40px 28px; }
      .auth-card h1 { font-size: 36px; }
      .tool-chip { padding: 6px 14px; font-size: 12px; }
      .input-area textarea { padding: 16px 110px 16px 18px; }
      .result-panel { padding: 18px; }
      .data-table { font-size: 12px; }
      .data-table th, .data-table td { padding: 10px 10px; }
    }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <h1>Wongzo</h1>
    <p>Sign in to access your SEO research tools</p>
    <div id="google-btn"></div>
    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<!-- Main App (hidden until authed) -->
<div id="app" style="display:none">
  <div class="topbar">
    <span class="topbar-brand">Wongzo</span>
    <div class="topbar-user">
      <img id="user-pic" src="" alt="">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">
        <span class="sidebar-label-text">Search History</span>
        <span class="count" id="history-count">0</span>
      </div>
      <div id="history-list">
        <div class="history-empty">No searches yet</div>
      </div>
    </div>

    <div class="main">
      <div class="tools">
        <span class="tool-chip" data-q="Find keywords for ">Keywords</span>
        <span class="tool-chip" data-q="Analyze competitors for ">Competitors</span>
        <span class="tool-chip" data-q="Analyze SERP for ">SERP</span>
        <span class="tool-chip" data-q="Find content gaps for ">Content Gaps</span>
        <span class="tool-chip" data-q="Write a blog post about ">Generate Content</span>
      </div>

      <div class="input-area">
        <textarea id="query" rows="2" placeholder="e.g. What keywords should I target for hard water shower filters?"></textarea>
        <button id="submit" onclick="submitQuery()">Run</button>
      </div>

      <div class="error" id="error"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Researching with Jina AI and analyzing with LLM...</p>
      </div>
      <div class="result" id="result"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let GOOGLE_CLIENT_ID = '';
let idToken = null;
let currentUser = null;

async function fetchConfig() {
  const res = await fetch('/api/config');
  const data = await res.json();
  GOOGLE_CLIENT_ID = data.google_client_id;
}

function initGoogleAuth() {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
  });
  google.accounts.id.renderButton($('google-btn'), {
    theme: 'filled_black',
    size: 'large',
    shape: 'pill',
    text: 'signin_with',
  });
  const stored = sessionStorage.getItem('seo_token');
  if (stored) {
    idToken = stored;
    const payload = JSON.parse(atob(stored.split('.')[1]));
    showApp({ email: payload.email, name: payload.name, picture: payload.picture });
  }
}

function handleCredentialResponse(response) {
  idToken = response.credential;
  sessionStorage.setItem('seo_token', idToken);
  const payload = JSON.parse(atob(idToken.split('.')[1]));
  showApp({ email: payload.email, name: payload.name, picture: payload.picture });
}

function showApp(user) {
  currentUser = user;
  $('auth-screen').style.display = 'none';
  $('app').style.display = 'block';
  $('user-pic').src = user.picture || '';
  $('user-name').textContent = user.email;
  loadHistory();
}

function logout() {
  idToken = null;
  currentUser = null;
  sessionStorage.removeItem('seo_token');
  google.accounts.id.disableAutoSelect();
  $('app').style.display = 'none';
  $('auth-screen').style.display = 'flex';
}

window.addEventListener('load', async () => {
  await fetchConfig();
  const check = setInterval(() => {
    if (typeof google !== 'undefined' && google.accounts) {
      clearInterval(check);
      initGoogleAuth();
    }
  }, 100);
});

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${idToken}`,
  };
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const data = await res.json();
    renderHistory(data);
  } catch (e) {}
}

function renderHistory(items) {
  const list = $('history-list');
  $('history-count').textContent = items.length;
  if (!items.length) {
    list.innerHTML = '<div class="history-empty">No searches yet</div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const date = new Date(item.created_at).toLocaleDateString();
    return `<div class="history-item" onclick='showHistoryItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
      <div class="hi-query">${esc(item.query)}</div>
      <div class="hi-meta">
        <span class="hi-tool">${item.tool_used.replace(/_/g, ' ')}</span>
        <span>${date}</span>
      </div>
    </div>`;
  }).join('');
}

function showHistoryItem(item) {
  renderResult({ tool_used: item.tool_used, query: item.query, result: item.result });
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tool-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const q = $('query');
      q.value = chip.dataset.q;
      q.focus();
      q.setSelectionRange(q.value.length, q.value.length);
      document.querySelectorAll('.tool-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });
  $('query').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(); }
  });
});

async function submitQuery() {
  const query = $('query').value.trim();
  if (!query) return;
  $('error').classList.remove('show');
  $('result').classList.remove('show');
  $('loading').classList.add('show');
  $('submit').disabled = true;
  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ query })
    });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const data = await res.json();
    if (data.error) {
      $('error').textContent = data.error;
      $('error').classList.add('show');
      return;
    }
    renderResult(data);
    loadHistory();
  } catch (err) {
    $('error').textContent = 'Network error: ' + err.message;
    $('error').classList.add('show');
  } finally {
    $('loading').classList.remove('show');
    $('submit').disabled = false;
  }
}

function renderResult(data) {
  const el = $('result');
  const tool = data.tool_used;
  const r = data.result;
  let html = `<div class="result-header">
    <span class="result-badge">${tool.replace(/_/g, ' ')}</span>
    <span class="result-query">${esc(data.query)}</span>
  </div>`;
  if (tool === 'keyword_research') html += renderKeywords(r);
  else if (tool === 'competitor_analysis') html += renderCompetitors(r);
  else if (tool === 'serp_analysis') html += renderSERP(r);
  else if (tool === 'content_gap') html += renderGaps(r);
  else if (tool === 'content_generation') html += renderContent(r);
  else html += `<pre>${JSON.stringify(r, null, 2)}</pre>`;
  el.innerHTML = html;
  el.classList.add('show');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function diffBadge(d) {
  const l = d.toLowerCase();
  const cls = { low: 'low', medium: 'medium', high: 'high' }[l] || 'medium';
  return `<span class="badge badge-${cls}">${d}</span>`;
}

function intentBadge(i) {
  const l = i.toLowerCase();
  return `<span class="badge badge-intent">${i}</span>`;
}

function renderKeywords(r) {
  let h = `<div class="glass-panel result-panel"><table class="data-table"><thead><tr>
    <th>Keyword</th><th>Volume</th><th>Difficulty</th><th>Intent</th><th>CPC</th><th>Notes</th>
  </tr></thead><tbody>`;
  for (const k of r.keywords) {
    h += `<tr><td><strong>${esc(k.keyword)}</strong></td><td>${esc(k.search_volume)}</td>
      <td>${diffBadge(k.difficulty)}</td><td>${intentBadge(k.intent)}</td>
      <td>${esc(k.cpc_estimate)}</td><td class="cell-dim">${esc(k.notes)}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  if (r.long_tail_suggestions?.length) {
    h += `<div class="glass-panel result-panel"><div class="panel-label">Long-tail Suggestions</div><ul class="panel-list">`;
    for (const s of r.long_tail_suggestions) h += `<li>${esc(s)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="glass-panel result-panel"><div class="panel-label">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderCompetitors(r) {
  let h = '';
  for (const c of r.competitors) {
    h += `<div class="glass-panel result-panel competitor-card"><h3>${esc(c.title)}</h3><div class="comp-url">${esc(c.url)}</div>
      <div class="comp-meta"><span>${esc(c.content_type)}</span><span>~${esc(c.estimated_word_count)} words</span></div>
      <ul class="strengths">${c.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <ul class="weaknesses">${c.weaknesses.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }
  if (r.opportunities?.length) {
    h += `<div class="glass-panel result-panel"><div class="panel-label">Opportunities</div><ul class="panel-list">`;
    for (const o of r.opportunities) h += `<li>${esc(o)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="glass-panel result-panel"><div class="panel-label">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderSERP(r) {
  let h = `<div class="glass-panel result-panel"><table class="data-table"><thead><tr>
    <th>#</th><th>Title</th><th>Type</th><th>URL</th>
  </tr></thead><tbody>`;
  for (const e of r.entries) {
    h += `<tr><td><span class="serp-pos">${e.position}</span></td>
      <td><strong>${esc(e.title)}</strong><br><span class="cell-dim">${esc(e.snippet)}</span></td>
      <td><span class="badge badge-intent">${esc(e.content_type)}</span></td>
      <td class="cell-dim" style="word-break:break-all">${esc(e.url)}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  h += `<div class="glass-panel result-panel"><div class="panel-label">SERP Features</div><ul class="panel-list">`;
  for (const f of r.serp_features) h += `<li>${esc(f)}</li>`;
  h += `</ul></div>`;
  h += `<div class="glass-panel result-panel"><div class="panel-label">Dominant Intent: ${esc(r.dominant_intent)}</div>
    <p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderGaps(r) {
  let h = `<div class="glass-panel result-panel"><table class="data-table"><thead><tr>
    <th>Topic</th><th>Gap Type</th><th>Opportunity</th><th>Suggested Angle</th>
  </tr></thead><tbody>`;
  for (const g of r.gaps) {
    h += `<tr><td><strong>${esc(g.topic)}</strong></td><td>${esc(g.gap_type)}</td>
      <td>${diffBadge(g.opportunity_score)}</td><td class="cell-dim">${esc(g.suggested_angle)}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  if (r.underserved_subtopics?.length) {
    h += `<div class="glass-panel result-panel"><div class="panel-label">Underserved Subtopics</div><ul class="panel-list">`;
    for (const s of r.underserved_subtopics) h += `<li>${esc(s)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="glass-panel result-panel"><div class="panel-label">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderContent(r) {
  let h = `<div class="glass-panel result-panel article-meta"><h2>${esc(r.title)}</h2>
    <p class="meta-desc">${esc(r.meta_description)}</p>
    <div class="kw-tags"><span class="kw-tag">${esc(r.target_keyword)}</span>`;
  for (const k of r.secondary_keywords) h += `<span class="kw-tag">${esc(k)}</span>`;
  h += `</div><p class="word-count">${r.word_count} words</p></div>`;
  if (r.outline?.length) {
    h += `<div class="glass-panel result-panel"><div class="panel-label">Outline</div><ul class="panel-list">`;
    for (const o of r.outline) h += `<li>${esc(o)}</li>`;
    h += `</ul></div>`;
  }
  let content = esc(r.content)
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  h += `<div class="glass-panel result-panel article-content"><p>${content}</p></div>`;
  if (r.seo_notes?.length) {
    h += `<div class="glass-panel result-panel"><div class="panel-label">SEO Notes</div><ul class="panel-list">`;
    for (const n of r.seo_notes) h += `<li>${esc(n)}</li>`;
    h += `</ul></div>`;
  }
  return h;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
</body>
</html>
