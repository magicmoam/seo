<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>trySEO.ai | AI-Powered SEO Intelligence</title>
  <meta name="description" content="AI-powered SEO intelligence platform. Analyze websites, research keywords, track competitors, and generate content strategies.">

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'alabaster': '#F0F0EB',
            'obsidian': '#0F0F0F',
            'burnished-gold': '#B89E5F',
            'soft-gray': '#A0A09C',
          },
          fontFamily: {
            serif: ['"Bodoni Moda"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Cormorant Garamond"', 'serif'],
          },
          backgroundImage: {
            'noise': "url('data:image/svg+xml,%3Csvg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cfilter id=\"noiseFilter\"%3E%3CfeTurbulence type=\"fractalNoise\" baseFrequency=\"0.8\" numOctaves=\"3\" stitchTiles=\"stitch\"/%3E%3C/filter%3E%3Crect width=\"100%25\" height=\"100%25\" filter=\"url(%23noiseFilter)\" opacity=\"0.08\"/%3E%3C/svg%3E')",
          }
        }
      }
    }
  </script>

  <!-- Three.js importmap for landing page -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- Shared Styles -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="relative font-sans selection:bg-burnished-gold selection:text-white">

  <!-- Ambient background -->
  <div class="ambient-bg"></div>

  <!-- Noise overlay -->
  <div class="fixed inset-0 z-10 pointer-events-none opacity-40 bg-noise mix-blend-overlay"></div>

  <!-- Scroll progress bar -->
  <div class="fixed top-0 left-0 w-full h-[2px] z-[60]">
    <div class="scroll-progress h-full bg-burnished-gold/60 w-full"></div>
  </div>

  <!-- Custom cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-circle"></div>

  <!-- Navigation container -->
  <div id="nav-container"></div>

  <!-- Page content container -->
  <div id="page">
    <div class="spa-loading"></div>
  </div>

  <!-- Upgrade modal -->
  <div class="upgrade-modal-overlay" id="upgrade-modal">
    <div class="upgrade-modal">
      <h2>Upgrade to Pro</h2>
      <p>You've used all your free credits. Upgrade to Pro for 200 credits/month and unlock the full power of trySEO.ai.</p>
      <a href="#/pricing" class="btn-primary" onclick="document.getElementById('upgrade-modal').classList.remove('active')">View Plans</a>
      <button class="btn-dismiss" onclick="document.getElementById('upgrade-modal').classList.remove('active')">Maybe Later</button>
    </div>
  </div>

  <!-- App initialization -->
  <script type="module">
    import { initAuth, onAuthStateChanged } from '/js/auth.js';
    import { initRouter, remountCurrentPage } from '/js/router.js';
    import { mountNav } from '/js/components/nav.js';
    import { initCursor } from '/js/components/cursor.js';
    import { initScrollEffects } from '/js/components/scroll-effects.js';

    // Listen for credits-exhausted events from api.js
    window.addEventListener('credits-exhausted', () => {
      document.getElementById('upgrade-modal').classList.add('active');
    });

    // Toast helper
    window.showToast = function(message, type = 'success', duration = 4000) {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    };

    // Initialize app
    async function init() {
      // Mount navigation
      mountNav(document.getElementById('nav-container'));

      // Init cursor (desktop only)
      initCursor();

      // Init scroll effects
      initScrollEffects();

      // Init auth (loads config, restores session)
      await initAuth();

      // Init router (loads initial page)
      initRouter();

      // Re-mount page when auth state changes
      onAuthStateChanged((user) => {
        const hash = window.location.hash.slice(1) || '/';
        const route = hash.split('?')[0];
        const guarded = ['/app', '/account', '/admin'];
        if (guarded.includes(route) && !user) {
          window.location.hash = '#/';
        }
      });

      // Check for upgrade success
      if (window.location.hash.includes('upgraded=true')) {
        setTimeout(() => {
          window.showToast('Welcome to Pro! You now have 200 credits.', 'success');
        }, 500);
      }
    }

    init().catch(console.error);
  </script>
</body>
</html>
