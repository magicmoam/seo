<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Agent</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3a;
      --text: #e4e4ef;
      --text-dim: #8888a0;
      --accent: #6c5ce7;
      --accent-glow: #7c6cf7;
      --green: #00d68f;
      --yellow: #f0c040;
      --red: #ff6b6b;
      --cyan: #00d2ff;
      --blue: #4a9eff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Auth screen */
    .auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    .auth-screen h1 {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-screen p {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 16px;
    }

    .auth-error {
      color: var(--red);
      font-size: 13px;
      display: none;
    }

    .auth-error.show { display: block; }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topbar-brand {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-user img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .topbar-user span {
      font-size: 13px;
      color: var(--text-dim);
    }

    .btn-logout {
      padding: 4px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* Layout */
    .layout {
      display: flex;
      min-height: calc(100vh - 53px);
    }

    .sidebar {
      width: 280px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 16px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title .count {
      background: var(--surface2);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .history-item:hover {
      background: var(--surface2);
    }

    .history-item .hi-query {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item .hi-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 8px;
    }

    .history-item .hi-tool {
      color: var(--accent-glow);
    }

    .history-empty {
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      padding: 40px 0;
    }

    /* Main content */
    .main {
      flex: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .tools {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tool-chip {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tool-chip:hover, .tool-chip.active {
      border-color: var(--accent);
      color: var(--accent-glow);
      background: rgba(108, 92, 231, 0.1);
    }

    .input-area {
      position: relative;
      margin-bottom: 32px;
    }

    .input-area textarea {
      width: 100%;
      padding: 18px 120px 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
      min-height: 60px;
      max-height: 120px;
    }

    .input-area textarea:focus { border-color: var(--accent); }
    .input-area textarea::placeholder { color: var(--text-dim); }

    .input-area button {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 10px 24px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .input-area button:hover:not(:disabled) {
      background: var(--accent-glow);
      transform: translateY(-1px);
    }

    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading { text-align: center; padding: 60px 0; display: none; }
    .loading.show { display: block; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading p { color: var(--text-dim); font-size: 14px; }

    .error {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 10px;
      padding: 16px;
      color: var(--red);
      margin-bottom: 24px;
      display: none;
    }

    .error.show { display: block; }

    .result { display: none; }
    .result.show { display: block; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .result-badge {
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(108, 92, 231, 0.15);
      color: var(--accent-glow);
    }

    .result-query { color: var(--text-dim); font-size: 14px; }

    .data-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; font-size: 13px; }
    .data-table th {
      text-align: left; padding: 10px 12px; background: var(--surface2);
      border-bottom: 2px solid var(--border); color: var(--text-dim);
      font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-low { background: rgba(0, 214, 143, 0.15); color: var(--green); }
    .badge-medium { background: rgba(240, 192, 64, 0.15); color: var(--yellow); }
    .badge-high { background: rgba(255, 107, 107, 0.15); color: var(--red); }
    .badge-info { background: rgba(0, 210, 255, 0.15); color: var(--cyan); }
    .badge-comm { background: rgba(108, 92, 231, 0.15); color: var(--accent-glow); }
    .badge-trans { background: rgba(0, 214, 143, 0.15); color: var(--green); }
    .badge-nav { background: rgba(74, 158, 255, 0.15); color: var(--blue); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .card h3 { font-size: 15px; margin-bottom: 4px; }
    .card .url { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; word-break: break-all; }
    .card-meta { display: flex; gap: 12px; margin-bottom: 12px; font-size: 12px; color: var(--text-dim); }

    .strengths, .weaknesses { font-size: 13px; margin-bottom: 8px; }
    .strengths li { color: var(--green); }
    .weaknesses li { color: var(--red); }
    .strengths li, .weaknesses li { margin-bottom: 4px; list-style: none; padding-left: 16px; position: relative; }
    .strengths li::before { content: "+"; position: absolute; left: 0; }
    .weaknesses li::before { content: "-"; position: absolute; left: 0; }

    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 20px; margin-bottom: 16px;
    }
    .panel-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--accent-glow); margin-bottom: 8px;
    }
    .panel ul { list-style: none; padding: 0; }
    .panel li { padding: 4px 0; font-size: 13px; color: var(--text); padding-left: 16px; position: relative; }
    .panel li::before { content: ">"; position: absolute; left: 0; color: var(--text-dim); }

    .summary-text { font-size: 14px; line-height: 1.6; color: var(--text); }

    .article-meta {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px; margin-bottom: 24px;
    }
    .article-meta h2 { font-size: 20px; margin-bottom: 8px; }
    .article-meta .meta-desc { color: var(--text-dim); font-size: 14px; margin-bottom: 16px; font-style: italic; }
    .article-meta .keywords { display: flex; gap: 6px; flex-wrap: wrap; }
    .article-meta .kw-tag { padding: 3px 10px; background: rgba(108, 92, 231, 0.12); border-radius: 4px; font-size: 12px; color: var(--accent-glow); }

    .article-content {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 32px; font-size: 15px; line-height: 1.8;
    }
    .article-content h1, .article-content h2, .article-content h3 { margin: 24px 0 12px; color: var(--text); }
    .article-content h2 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .article-content h3 { font-size: 17px; color: var(--cyan); }
    .article-content p { margin-bottom: 12px; }
    .article-content ul, .article-content ol { margin: 8px 0 16px 24px; }
    .article-content li { margin-bottom: 6px; }
    .article-content strong { color: #fff; }

    .serp-pos {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px;
      background: var(--surface2); font-size: 12px; font-weight: 700; color: var(--accent-glow);
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen" class="auth-screen">
  <h1>SEO Agent</h1>
  <p>Sign in to access your SEO research tools</p>
  <div id="g_id_onload"></div>
  <div id="google-btn"></div>
  <p class="auth-error" id="auth-error"></p>
</div>

<!-- Main App (hidden until authed) -->
<div id="app" style="display:none">
  <div class="topbar">
    <span class="topbar-brand">SEO Agent</span>
    <div class="topbar-user">
      <img id="user-pic" src="" alt="">
      <span id="user-name"></span>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">
        Search History
        <span class="count" id="history-count">0</span>
      </div>
      <div id="history-list">
        <div class="history-empty">No searches yet</div>
      </div>
    </div>

    <div class="main">
      <div class="tools">
        <span class="tool-chip" data-q="Find keywords for ">Keywords</span>
        <span class="tool-chip" data-q="Analyze competitors for ">Competitors</span>
        <span class="tool-chip" data-q="Analyze SERP for ">SERP</span>
        <span class="tool-chip" data-q="Find content gaps for ">Content Gaps</span>
        <span class="tool-chip" data-q="Write a blog post about ">Generate Content</span>
      </div>

      <div class="input-area">
        <textarea id="query" rows="2" placeholder="e.g. What keywords should I target for hard water shower filters?"></textarea>
        <button id="submit" onclick="submitQuery()">Run</button>
      </div>

      <div class="error" id="error"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Researching with Jina AI and analyzing with LLM...</p>
      </div>
      <div class="result" id="result"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let GOOGLE_CLIENT_ID = '';

let idToken = null;
let currentUser = null;

// ─── Google Auth ───

async function fetchConfig() {
  const res = await fetch('/api/config');
  const data = await res.json();
  GOOGLE_CLIENT_ID = data.google_client_id;
}

function initGoogleAuth() {
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
  });
  google.accounts.id.renderButton($('google-btn'), {
    theme: 'filled_black',
    size: 'large',
    shape: 'pill',
    text: 'signin_with',
  });
  // Check for stored session
  const stored = sessionStorage.getItem('seo_token');
  if (stored) {
    idToken = stored;
    const payload = JSON.parse(atob(stored.split('.')[1]));
    showApp({ email: payload.email, name: payload.name, picture: payload.picture });
  }
}

function handleCredentialResponse(response) {
  idToken = response.credential;
  sessionStorage.setItem('seo_token', idToken);
  const payload = JSON.parse(atob(idToken.split('.')[1]));
  showApp({ email: payload.email, name: payload.name, picture: payload.picture });
}

function showApp(user) {
  currentUser = user;
  $('auth-screen').style.display = 'none';
  $('app').style.display = 'block';
  $('user-pic').src = user.picture || '';
  $('user-name').textContent = user.email;
  loadHistory();
}

function logout() {
  idToken = null;
  currentUser = null;
  sessionStorage.removeItem('seo_token');
  google.accounts.id.disableAutoSelect();
  $('app').style.display = 'none';
  $('auth-screen').style.display = 'flex';
}

// Wait for Google script + config to load
window.addEventListener('load', async () => {
  await fetchConfig();
  const check = setInterval(() => {
    if (typeof google !== 'undefined' && google.accounts) {
      clearInterval(check);
      initGoogleAuth();
    }
  }, 100);
});

// ─── API calls ───

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': `Bearer ${idToken}`,
  };
}

async function loadHistory() {
  try {
    const res = await fetch('/api/history', { headers: authHeaders() });
    if (res.status === 401 || res.status === 403) { logout(); return; }
    const data = await res.json();
    renderHistory(data);
  } catch (e) {
    // history loading is best-effort
  }
}

function renderHistory(items) {
  const list = $('history-list');
  $('history-count').textContent = items.length;
  if (!items.length) {
    list.innerHTML = '<div class="history-empty">No searches yet</div>';
    return;
  }
  list.innerHTML = items.map(item => {
    const date = new Date(item.created_at).toLocaleDateString();
    return `<div class="history-item" onclick='showHistoryItem(${JSON.stringify(item).replace(/'/g, "&#39;")})'>
      <div class="hi-query">${esc(item.query)}</div>
      <div class="hi-meta">
        <span class="hi-tool">${item.tool_used.replace(/_/g, ' ')}</span>
        <span>${date}</span>
      </div>
    </div>`;
  }).join('');
}

function showHistoryItem(item) {
  renderResult({ tool_used: item.tool_used, query: item.query, result: item.result });
}

// ─── Tool chips ───

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tool-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const q = $('query');
      q.value = chip.dataset.q;
      q.focus();
      q.setSelectionRange(q.value.length, q.value.length);
      document.querySelectorAll('.tool-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
  });

  $('query').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(); }
  });
});

// ─── Submit ───

async function submitQuery() {
  const query = $('query').value.trim();
  if (!query) return;

  $('error').classList.remove('show');
  $('result').classList.remove('show');
  $('loading').classList.add('show');
  $('submit').disabled = true;

  try {
    const res = await fetch('/api/query', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ query })
    });

    if (res.status === 401 || res.status === 403) { logout(); return; }

    const data = await res.json();

    if (data.error) {
      $('error').textContent = data.error;
      $('error').classList.add('show');
      return;
    }

    renderResult(data);
    loadHistory(); // refresh sidebar
  } catch (err) {
    $('error').textContent = 'Network error: ' + err.message;
    $('error').classList.add('show');
  } finally {
    $('loading').classList.remove('show');
    $('submit').disabled = false;
  }
}

// ─── Render ───

function renderResult(data) {
  const el = $('result');
  const tool = data.tool_used;
  const r = data.result;

  let html = `<div class="result-header">
    <span class="result-badge">${tool.replace(/_/g, ' ')}</span>
    <span class="result-query">${esc(data.query)}</span>
  </div>`;

  if (tool === 'keyword_research') html += renderKeywords(r);
  else if (tool === 'competitor_analysis') html += renderCompetitors(r);
  else if (tool === 'serp_analysis') html += renderSERP(r);
  else if (tool === 'content_gap') html += renderGaps(r);
  else if (tool === 'content_generation') html += renderContent(r);
  else html += `<pre>${JSON.stringify(r, null, 2)}</pre>`;

  el.innerHTML = html;
  el.classList.add('show');
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function diffBadge(d) {
  return `<span class="badge badge-${d.toLowerCase()}">${d}</span>`;
}

function intentBadge(i) {
  const cls = { informational:'info', commercial:'comm', transactional:'trans', navigational:'nav' }[i.toLowerCase()] || 'info';
  return `<span class="badge badge-${cls}">${i}</span>`;
}

function renderKeywords(r) {
  let h = `<table class="data-table"><thead><tr>
    <th>Keyword</th><th>Volume</th><th>Difficulty</th><th>Intent</th><th>CPC</th><th>Notes</th>
  </tr></thead><tbody>`;
  for (const k of r.keywords) {
    h += `<tr><td><strong>${esc(k.keyword)}</strong></td><td>${esc(k.search_volume)}</td>
      <td>${diffBadge(k.difficulty)}</td><td>${intentBadge(k.intent)}</td>
      <td>${esc(k.cpc_estimate)}</td><td style="color:var(--text-dim);font-size:12px">${esc(k.notes)}</td></tr>`;
  }
  h += `</tbody></table>`;
  if (r.long_tail_suggestions?.length) {
    h += `<div class="panel"><div class="panel-title">Long-tail Suggestions</div><ul>`;
    for (const s of r.long_tail_suggestions) h += `<li>${esc(s)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="panel"><div class="panel-title">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderCompetitors(r) {
  let h = '';
  for (const c of r.competitors) {
    h += `<div class="card"><h3>${esc(c.title)}</h3><div class="url">${esc(c.url)}</div>
      <div class="card-meta"><span>${esc(c.content_type)}</span><span>~${esc(c.estimated_word_count)} words</span></div>
      <ul class="strengths">${c.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
      <ul class="weaknesses">${c.weaknesses.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;
  }
  if (r.opportunities?.length) {
    h += `<div class="panel"><div class="panel-title">Opportunities</div><ul>`;
    for (const o of r.opportunities) h += `<li>${esc(o)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="panel"><div class="panel-title">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderSERP(r) {
  let h = `<table class="data-table"><thead><tr>
    <th>#</th><th>Title</th><th>Type</th><th>URL</th>
  </tr></thead><tbody>`;
  for (const e of r.entries) {
    h += `<tr><td><span class="serp-pos">${e.position}</span></td>
      <td><strong>${esc(e.title)}</strong><br><span style="color:var(--text-dim);font-size:12px">${esc(e.snippet)}</span></td>
      <td><span class="badge badge-info">${esc(e.content_type)}</span></td>
      <td style="font-size:12px;color:var(--text-dim);word-break:break-all">${esc(e.url)}</td></tr>`;
  }
  h += `</tbody></table>`;
  h += `<div class="panel"><div class="panel-title">SERP Features</div><ul>`;
  for (const f of r.serp_features) h += `<li>${esc(f)}</li>`;
  h += `</ul></div>`;
  h += `<div class="panel"><div class="panel-title">Dominant Intent: ${esc(r.dominant_intent)}</div>
    <p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderGaps(r) {
  let h = `<table class="data-table"><thead><tr>
    <th>Topic</th><th>Gap Type</th><th>Opportunity</th><th>Suggested Angle</th>
  </tr></thead><tbody>`;
  for (const g of r.gaps) {
    h += `<tr><td><strong>${esc(g.topic)}</strong></td><td>${esc(g.gap_type)}</td>
      <td>${diffBadge(g.opportunity_score)}</td><td style="font-size:13px">${esc(g.suggested_angle)}</td></tr>`;
  }
  h += `</tbody></table>`;
  if (r.underserved_subtopics?.length) {
    h += `<div class="panel"><div class="panel-title">Underserved Subtopics</div><ul>`;
    for (const s of r.underserved_subtopics) h += `<li>${esc(s)}</li>`;
    h += `</ul></div>`;
  }
  h += `<div class="panel"><div class="panel-title">Summary</div><p class="summary-text">${esc(r.summary)}</p></div>`;
  return h;
}

function renderContent(r) {
  let h = `<div class="article-meta"><h2>${esc(r.title)}</h2>
    <p class="meta-desc">${esc(r.meta_description)}</p>
    <div class="keywords"><span class="kw-tag">${esc(r.target_keyword)}</span>`;
  for (const k of r.secondary_keywords) h += `<span class="kw-tag">${esc(k)}</span>`;
  h += `</div><p style="margin-top:12px;font-size:13px;color:var(--text-dim)">${r.word_count} words</p></div>`;
  if (r.outline?.length) {
    h += `<div class="panel"><div class="panel-title">Outline</div><ul>`;
    for (const o of r.outline) h += `<li>${esc(o)}</li>`;
    h += `</ul></div>`;
  }
  let content = esc(r.content)
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^\- (.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  h += `<div class="article-content"><p>${content}</p></div>`;
  if (r.seo_notes?.length) {
    h += `<div class="panel" style="margin-top:16px"><div class="panel-title">SEO Notes</div><ul>`;
    for (const n of r.seo_notes) h += `<li>${esc(n)}</li>`;
    h += `</ul></div>`;
  }
  return h;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
</script>
</body>
</html>
