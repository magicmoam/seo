[project]
name = "seo-agent"
version = "0.1.0"
description = "AI-powered SEO agent for keyword research, competitor analysis, SERP analysis, content gap detection, and content generation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
seo-agent = "src.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
