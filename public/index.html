<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Retune — AI-Powered SEO Intelligence</title>
  <meta name="description" content="Retune is an AI-powered SEO intelligence platform. Analyze websites, research keywords, track competitors, and generate data-driven content strategies.">
  <meta name="keywords" content="SEO, AI SEO, keyword research, competitor analysis, website audit, content strategy, technical SEO, backlink analysis">

  <!-- Canonical -->
  <link rel="canonical" href="https://retune.so">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://retune.so">
  <meta property="og:title" content="Retune — AI-Powered SEO Intelligence">
  <meta property="og:description" content="Retune is an AI-powered SEO intelligence platform. Analyze websites, research keywords, track competitors, and generate data-driven content strategies.">
  <meta property="og:image" content="https://retune.so/og-image.svg">
  <meta property="og:site_name" content="Retune">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Retune — AI-Powered SEO Intelligence">
  <meta name="twitter:description" content="Retune is an AI-powered SEO intelligence platform. Analyze websites, research keywords, track competitors, and generate data-driven content strategies.">
  <meta name="twitter:image" content="https://retune.so/og-image.svg">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Retune",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "url": "https://retune.so",
    "description": "AI-powered SEO intelligence platform with 10 specialized tools. Analyze websites, research keywords, audit technical SEO, and generate data-driven content strategies.",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free",
        "price": "0",
        "priceCurrency": "USD",
        "description": "5 credits per month with basic SEO audit"
      },
      {
        "@type": "Offer",
        "name": "Pro",
        "price": "49",
        "priceCurrency": "USD",
        "billingIncrement": "P1M",
        "description": "200 credits per month with all 10 AI-powered SEO tools"
      }
    ]
  }
  </script>

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Fonts: Syne + IBM Plex Mono -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Module Preloads -->
  <link rel="modulepreload" href="/js/pages/landing.js">
  <link rel="modulepreload" href="/js/auth.js">
  <link rel="modulepreload" href="/js/api.js">

  <!-- Shared Styles -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Noscript fallback for crawlers -->
  <noscript>
    <div style="max-width:800px;margin:0 auto;padding:60px 24px;font-family:'IBM Plex Mono',monospace;color:#e0e0e0;background:#0a0a0a">
      <h1 style="font-family:'Syne',sans-serif;font-size:36px;margin-bottom:16px;color:#fff">Retune &mdash; AI-Powered SEO Intelligence</h1>
      <p style="color:#888;line-height:1.8;margin-bottom:24px">Analyze websites, research keywords, track competitors, and generate data-driven content strategies with 10 AI-powered tools. Start with a free audit.</p>
      <nav style="margin-bottom:32px">
        <a href="/features" style="margin-right:24px;color:#00e5a0">Features</a>
        <a href="/pricing" style="margin-right:24px;color:#00e5a0">Pricing</a>
        <a href="/about" style="margin-right:24px;color:#00e5a0">About</a>
      </nav>
      <h2 style="font-size:20px;margin-bottom:12px;color:#fff">10 AI-Powered SEO Tools</h2>
      <ul style="color:#888;line-height:2">
        <li>Website Analyzer &mdash; 30-criteria site audit with scoring rubric</li>
        <li>Keyword Research &mdash; Intent-mapped keyword clusters</li>
        <li>Competitor Analysis &mdash; Gap identification and positioning</li>
        <li>SERP Analysis &mdash; Ranking factor and feature detection</li>
        <li>Content Gap &mdash; Missing content opportunities</li>
        <li>Content Generation &mdash; AI-generated SEO content</li>
        <li>Topical Authority &mdash; Content cluster mapping</li>
        <li>Technical SEO &mdash; Core Web Vitals and crawlability</li>
        <li>Backlink Strategy &mdash; Link building opportunities</li>
        <li>Strategy Orchestrator &mdash; All tools in one unified pipeline</li>
      </ul>
      <p style="margin-top:24px;color:#888">Free tier: 5 credits/month. Pro: $49/month with 200 credits.</p>
    </div>
  </noscript>

  <!-- Scan line (system-active aesthetic) -->
  <div class="scan-line-container"><div class="scan-line"></div></div>

  <!-- Navigation mounts here -->
  <div id="nav-container"></div>

  <!-- Page content mounts here -->
  <div id="page">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;">
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Upgrade modal -->
  <div id="upgrade-modal"></div>

  <!-- Scroll progress bar -->
  <div class="scroll-progress" style="position:fixed;top:0;left:0;height:2px;background:var(--accent-olive);transform-origin:left;transform:scaleX(0);z-index:9999;transition:transform 0.1s;"></div>

  <!-- App initialization -->
  <script type="module">
    import { initAuth, onAuthStateChanged } from '/js/auth.js';
    import { initRouter, navigate } from '/js/router.js';
    import { mountNav } from '/js/components/nav.js';
    import { initScrollEffects } from '/js/components/scroll-effects.js';

    (async () => {
      mountNav();
      initScrollEffects();
      await initAuth();
      initRouter();

      // Show upgrade modal on credits exhausted
      window.addEventListener('credits-exhausted', () => {
        document.getElementById('upgrade-modal').innerHTML = `
          <div class="modal-backdrop" id="upgrade-backdrop">
            <div class="modal-content">
              <button class="modal-close" onclick="document.getElementById('upgrade-backdrop').remove()">×</button>
              <span class="label">Credits Exhausted</span>
              <h2 style="font-size:1.5rem;margin-bottom:1rem;color:var(--text-main)">Upgrade to Retune Pro</h2>
              <p style="color:var(--text-muted);margin-bottom:1.5rem;">You've used all your free credits. Upgrade for 200 credits/month.</p>
              <button class="btn-primary" onclick="window.location.href='/#/pricing'">View Plans</button>
            </div>
          </div>
        `;
      });

      window.showToast = function(message, type = 'success', duration = 4000) {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transition = 'opacity 0.3s';
          setTimeout(() => toast.remove(), 300);
        }, duration);
      };
    })();
  </script>
</body>
</html>
